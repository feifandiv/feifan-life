name: Draft Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Check publication prerequisites
        run: |
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          node --input-type=module -e '
            import fs from "node:fs";
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (!/^\d+\.\d+\.\d+$/.test(manifest.version) || manifest.version !== pkg.version) process.exit(1);
            fs.appendFileSync(process.env.GITHUB_ENV, "RELEASE_TAG=" + manifest.version + "\n");
          '
      - name: Verify existing version tag points to this source
        run: test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$GITHUB_SHA"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - run: node scripts/license-inventory.mjs --check
      - run: npm run check:public
      - name: Create draft with the three Obsidian install assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            build/main.js build/manifest.json build/styles.css \
            --verify-tag --draft --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
